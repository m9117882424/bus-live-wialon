name: Bus booking checks
on:
  pull_request:
    paths: ['bus-booking/**', '.github/workflows/bus-booking.yml']
  push:
    branches: ['feature/bus-driver-accounts-zh-20261117', 'main']
    paths: ['bus-booking/**', '.github/workflows/bus-booking.yml']
permissions:
  contents: read
jobs:
  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bus-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-wqy-zenhei
          python -m pip install -r requirements.txt requests==2.33.1
      - name: Check accounts, booking rules, languages and exports
        run: |
          python tests/test_public_analytics.py
          node --check public_analytics/static/analytics.js
          python tests/test_driver_accounts_http.py
          python tests/test_chinese.py
          python tests/live_regressions/test_rules.py
          python tests/live_regressions/test_horizon.py
          python tests/live_regressions/test_lang_routes.py
          python tests/live_regressions/test_chrome_pwa.py
          node tests/test_scanner_ui.js
          node tests/live_regressions/test_flag_picker.js
          node tests/live_regressions/test_lang_ui.js
          node tests/live_regressions/test_lang_runtime.js
          node tests/live_regressions/test_horizon_ui.js
          node tests/live_regressions/test_chrome_pwa_ui.js

  analytics-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bus-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analytics and browser
        run: |
          python -m pip install -r requirements-analytics.txt
          npm install --no-save --no-audit --no-fund puppeteer@24.31.0
      - name: Anonymous analytics, filters, Excel and responsive layout
        run: python tests/public_analytics_browser.py
