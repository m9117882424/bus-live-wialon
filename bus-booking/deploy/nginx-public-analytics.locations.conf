# Include inside bus.tsmenerji.online TLS server, before the final location /.
# Reuses the existing proxy snippet, security headers and read request limit.
location = /analytics { return 308 /analytics/; }
location ^~ /analytics/ {
    limit_except GET HEAD { deny all; }
    limit_req zone=bus_domain_lookup burst=30 nodelay;
    proxy_pass http://127.0.0.1:18346;
    include /etc/nginx/snippets/corporate-taxi-proxy.conf;
}
