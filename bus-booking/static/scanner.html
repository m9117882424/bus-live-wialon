<!doctype html>
<html lang="ru">

  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#142d48;font:16px system-ui,-apple-system,sans-serif}
    header{height:56px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:3px solid #13a6a0;padding:7px 14px}
    header img{height:34px;width:auto;vertical-align:middle}header b{margin-left:8px;color:#07549b;font-size:15px}
    main{max-width:560px;margin:auto;padding:12px 12px 28px}h1{font-size:22px;margin:3px 0 10px}
    button{font:inherit;font-weight:700;border:0;border-radius:10px;min-height:48px;padding:9px 14px;cursor:pointer}
    .primary{width:100%;background:#07549b;color:white}.secondary{background:#e8f1f9;color:#07549b}
     .head-tools{display:flex;align-items:center;gap:6px}.pin-btn{min-height:40px;min-width:44px;padding:6px 8px;font-size:22px}.pin-btn.ready{background:#d9f4e2;color:#0d6137}.lang{min-height:40px;padding:6px 12px}.camera{position:relative;overflow:hidden;border-radius:13px;background:#102d46;margin:8px 0}
    video{display:block;width:100%;height:min(36vh,300px);min-height:170px;object-fit:cover}.frame{position:absolute;pointer-events:none;inset:17% 24%;border:3px solid #fff9;border-radius:14px;box-shadow:0 0 0 999px #0003}
    .hint{font-size:14px;color:#526e84;margin:8px 0}.result{border-radius:14px;padding:16px;margin:10px 0;font-weight:700;overflow-wrap:anywhere}
    .result.good{background:#d5f5df;color:#12642d;border:2px solid #3ba758}.result.bad{background:#ffe6e3;color:#a32727;border:2px solid #d56159}.result.wait{background:#fff3d7;color:#78500a;border:2px solid #c49a38}
    .result h2{font-size:clamp(23px,6vw,30px);line-height:1.15;margin:0 0 8px}.result .cardno{font-size:clamp(25px,7vw,34px);line-height:1.15}
    .result .detail{font-size:15px;font-weight:600;line-height:1.4;margin-top:8px}.result .note{font-size:13px;font-weight:500;margin-top:9px}
    .manual{margin:10px 0;background:white;border:1px solid #dae5ef;border-radius:12px;padding:12px}.manual label{display:block;font-size:16px;font-weight:700;margin-bottom:8px}.manual-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.manual input{width:100%;min-width:0;font:inherit;font-size:20px;padding:10px;border:1px solid #bacbd7;border-radius:9px;letter-spacing:.04em}.manual-row button{min-width:106px}
    .install-btn{width:40px;height:40px;min-width:40px;min-height:40px;padding:0;display:flex;align-items:center;justify-content:center}.install-btn svg{width:21px;height:21px}.install-hint{margin:8px 0;padding:10px 12px;background:#edf8f3;border:1px solid #b7ddcb;border-radius:10px;color:#365e50;font-size:13px} [hidden]{display:none!important}
    .scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .camera.pass .frame{inset:36% 12%;border-color:#fff}
  </style>
</head>
<body>
<header><span><img src="/bus/logo.png" alt="TSM ENERJİ"><b>BUS</b></span><span class="head-tools"><span id="installPanel"><button class="secondary install-btn" id="installBtn" type="button" aria-label="Установить приложение Chrome" title="Установить приложение Chrome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 17v3h14v-3"/></svg></button></span><button class="secondary pin-btn" id="pinBtn" type="button" aria-label="Вход водителя" title="Вход водителя">🔐</button><button class="secondary lang" id="langBtn">RU / TR</button></span></header>
<main>
  <h1 id="title"></h1>
  <p class="install-hint" id="installHint" role="status" hidden></p>
  <div class="hint"><span id="driverStatus" role="status"></span> <button class="secondary" id="logoutBtn" type="button" hidden></button></div>
  <div class="manual" id="loginPanel" hidden><form id="loginForm"><label id="loginTitle" for="loginInput"></label><input id="loginInput" maxlength="40" autocomplete="username" autocapitalize="none" spellcheck="false" required><label id="passwordTitle" for="loginPassword"></label><input type="password" id="loginPassword" maxlength="128" autocomplete="current-password" required><button class="secondary" id="loginBtn" type="submit"></button></form></div>

</main>
<canvas id="canvas" hidden></canvas>
<script src="/bus/scanner/jsQR.js"></script>
<script>
const texts={
 ru:{qr:'QR',pass:'Пропуск',passHint:'Удерживайте красный номер в рамке. Считывание автоматическое.',passUnread:'Номер не считан. Наведите рамку на красные цифры или введите их вручную.',title:'Контроль посадки',start:'Включить камеру',stop:'Остановить камеру',next:'Сканировать следующий QR',hint:'Наведите камеру на QR-код подтверждения.',allowed:'✓ Посадка разрешена!',card:'Пропуск №',check:'Сверьте номер с пропуском пассажира.',invalid:'QR-код не подтверждён',cancelled:'Бронь отменена',expired:'Бронь не найдена или срок истёк',outside:'Посадка сейчас не разрешена',outside_window:'Посадка сейчас не разрешена',badCard:'Введите номер пропуска: от 4 до 12 цифр',time:'Время допуска',net:'Нет связи с сервером. Проверка невозможна.',camera:'Нет доступа к камере. Разрешите доступ в настройках телефона.',busy:'Проверяем…',expiredResult:'Проверка завершена. Проверьте следующего пассажира.',install:'Установить приложение Chrome',installTip:'Откройте меню Chrome и выберите «Установить приложение» или «Добавить на главный экран».',installTipAndroid:'В Chrome нажмите ⋮ → «Установить приложение». Значок TSM Посадка появится на экране телефона.',installTipDesktop:'В Chrome нажмите значок установки справа в адресной строке или откройте меню ⋮ и выберите установку приложения.',manual:'Номер пропуска',manualButton:'Проверить',loginTitle:'Логин водителя',passwordTitle:'Пароль',loginButton:'Войти',logoutButton:'Выйти',signedIn:'Водитель:',signedOut:'Войдите в аккаунт, созданный администратором.',changeDriver:'Для смены водителя войдите в другой аккаунт.',sessionExpired:'Сессия истекла или доступ отозван. Войдите снова.',sessionNet:'Нет связи. Не удалось проверить вход. Повторите вход.',logoutNet:'Не удалось завершить сессию на сервере. Проверьте связь и нажмите «Выйти» снова.',loginEmpty:'Введите логин и пароль.',loginInvalid:'Неверный логин или пароль.',loginThrottled:'Слишком много попыток. Повторите через минуту.',loginOpen:'Вход / смена водителя',already_boarded:'Посадка уже отмечена',choose_trip:'Выберите рейс для отметки посадки',chooseButton:'Подтвердить посадку'},
 tr:{qr:'QR',pass:'Personel kartı',passHint:'Kırmızı numarayı çerçevede sabit tutun. Tarama otomatiktir.',passUnread:'Numara okunamadı. Kırmızı rakamları çerçeveye alın veya elle girin.',title:'Biniş kontrolü',start:'Kamerayı aç',stop:'Kamerayı durdur',next:'Sonraki QR kodunu okut',hint:'Kamerayı onay belgesindeki QR koduna tutun.',allowed:'✓ Binişe izin verildi!',card:'Kart no:',check:'Numarayı yolcunun kartıyla karşılaştırın.',invalid:'QR kodu doğrulanamadı',cancelled:'Rezervasyon iptal edildi',expired:'Rezervasyon bulunamadı veya süresi doldu',outside:'Şu anda binişe izin verilmiyor',outside_window:'Şu anda binişe izin verilmiyor',badCard:'Kart numarası 4–12 rakam olmalı',time:'Biniş aralığı',net:'Sunucu bağlantısı yok. Doğrulama yapılamıyor.',camera:'Kameraya erişilemiyor. Telefon ayarlarından izin verin.',busy:'Kontrol ediliyor…',expiredResult:'Kontrol tamamlandı. Sonraki yolcuyu kontrol edin.',install:'Chrome uygulamasını yükle',installTip:'Chrome menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini seçin.',installTipAndroid:'Chrome’da ⋮ → “Uygulamayı yükle” seçin. TSM Posadka simgesi telefonun ana ekranına eklenecek.',installTipDesktop:'Chrome adres çubuğundaki yükleme simgesini veya ⋮ menüsündeki uygulama yükleme seçeneğini kullanın.',manual:'Kart numarası',manualButton:'Kontrol et',loginTitle:'Sürücü kullanıcı adı',passwordTitle:'Parola',loginButton:'Giriş yap',logoutButton:'Çıkış yap',signedIn:'Sürücü:',signedOut:'Yöneticinin oluşturduğu hesaba giriş yapın.',changeDriver:'Sürücüyü değiştirmek için diğer hesaba giriş yapın.',sessionExpired:'Oturum süresi doldu veya erişim kapatıldı. Tekrar giriş yapın.',sessionNet:'Bağlantı yok. Oturum kontrol edilemedi. Tekrar giriş yapın.',logoutNet:'Sunucudaki oturum kapatılamadı. Bağlantıyı kontrol edip tekrar çıkış yapın.',loginEmpty:'Kullanıcı adı ve parola girin.',loginInvalid:'Kullanıcı adı veya parola yanlış.',loginThrottled:'Çok fazla deneme. Bir dakika sonra tekrar deneyin.',loginOpen:'Sürücü girişi / değiştir',already_boarded:'Biniş zaten kaydedildi',choose_trip:'Binişi kaydetmek için seferi seçin',chooseButton:'Binişi onayla'}
};
let lang='ru',stream=null,detector=null,scanning=false,scanTimer=null,resultTimer=null,installEvent=null,last=null,checkSerial=0;
try{lang=localStorage.getItem('bus-scanner-lang')||'ru'}catch(e){}
if(!texts[lang])lang='ru';
const el=id=>document.getElementById(id);
const video=el('video'),canvas=el('canvas'),result=el('result'),scanBtn=el('scanBtn'),pinBtn=el('pinBtn');
const passBtn=el('passBtn');
let scanMode='qr',passRequest=null,passMisses=0;
function setScanBusy(busy){scanBtn.disabled=busy;passBtn.disabled=busy}
let currentDriver=null,authSerial=0,authQueue=Promise.resolve(),authPending=false,sessionMessage='',logoutNeeded=false;
const activeRequests=new Set();
try{localStorage.removeItem('bus-scanner-code')}catch(e){}
function invalidateChecks(){checkSerial++;for(const request of activeRequests)request.abort();activeRequests.clear();stopCamera();clearResult();setScanBusy(false);el('manualBtn').disabled=false}
function openLogin(message='signedOut'){invalidateChecks();sessionMessage=message;el('loginPanel').hidden=false;el('loginPassword').value='';render();el('loginInput').focus()}
function expireSession(){authSerial++;currentDriver=null;authPending=false;openLogin('sessionExpired')}
function driverReady(){if(currentDriver&&!authPending&&el('loginPanel').hidden)return true;el('loginPanel').hidden=false;el('loginInput').focus();return false}
function authRequest(path,options={}){return fetch('/bus/api/scanner/'+path,{...options,credentials:'same-origin'})}
function enqueueAuth(task){const queued=authQueue.then(task,task);authQueue=queued.catch(()=>{});return queued}
async function restoreSession(){
 const serial=++authSerial;authPending=true;invalidateChecks();render();
 return enqueueAuth(async()=>{try{const r=await authRequest('session');if(serial!==authSerial)return;
  if(r.status===401){currentDriver=null;openLogin('signedOut');return}if(!r.ok)throw Error('network');const data=await r.json();if(serial!==authSerial)return;
  currentDriver=data;sessionMessage='';el('loginPanel').hidden=true;
 }catch(e){if(serial===authSerial){currentDriver=null;openLogin('sessionNet')}}finally{if(serial===authSerial){authPending=false;render()}}});
}
async function signIn(){
 const login=el('loginInput').value,password=el('loginPassword').value;
 if(!login.trim()||!password){sessionMessage='loginEmpty';render();return}
 const serial=++authSerial;currentDriver=null;authPending=true;invalidateChecks();sessionMessage='';el('loginPassword').value='';render();
 // Serialize authentication responses so a late Set-Cookie cannot follow logout.
 return enqueueAuth(async()=>{if(serial!==authSerial)return;try{
  const r=await authRequest('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password})});
  if(serial!==authSerial)return;
  if(r.status===401||r.status===422||r.status===429){openLogin(r.status===429?'loginThrottled':'loginInvalid');return}
  if(!r.ok)throw Error('network');const data=await r.json();if(serial!==authSerial)return;
  currentDriver=data;logoutNeeded=false;sessionMessage='';el('loginPanel').hidden=true;
 }catch(e){if(serial===authSerial)openLogin('sessionNet')}finally{if(serial===authSerial){authPending=false;render()}}});
}
async function signOut(){
 const serial=++authSerial;currentDriver=null;authPending=true;logoutNeeded=true;openLogin('signedOut');render();
 return enqueueAuth(async()=>{try{const r=await authRequest('logout',{method:'POST'});if(!r.ok)throw Error('network');if(serial===authSerial)logoutNeeded=false}
 catch(e){if(serial===authSerial)sessionMessage='logoutNet'}finally{if(serial===authSerial){authPending=false;render()}}});
}
pinBtn.addEventListener('click',()=>openLogin(currentDriver?'changeDriver':'signedOut'));
el('loginForm').addEventListener('submit',event=>{event.preventDefault();signIn()});
el('logoutBtn').addEventListener('click',signOut);
async function recordBoarding(token,legId,source,signal,serial){
 if(serial!==checkSerial||!driverReady())throw Error('stale');
 const r=await authRequest('verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,record:true,leg_id:legId,source}),signal});
 if(serial!==checkSerial)throw Error('stale');
 if(r.status===401){expireSession();throw Error('session')}if(!r.ok)throw Error('network');return r.json();
}
function formatWindow(value){try{return new Intl.DateTimeFormat(lang==='tr'?'tr-TR':'ru-RU',{timeZone:'Europe/Istanbul',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value))}catch(e){return value}}
function render(){let t=texts[lang];document.documentElement.lang=lang;pinBtn.textContent=currentDriver?'🔓':'🔐';pinBtn.classList.toggle('ready',!!currentDriver);pinBtn.title=t.loginOpen;pinBtn.setAttribute('aria-label',t.loginOpen);el('loginTitle').textContent=t.loginTitle;el('passwordTitle').textContent=t.passwordTitle;el('loginBtn').textContent=t.loginButton;el('loginBtn').disabled=authPending;el('logoutBtn').textContent=t.logoutButton;el('logoutBtn').hidden=!currentDriver&&!logoutNeeded;el('logoutBtn').disabled=authPending;el('driverStatus').textContent=currentDriver?t.signedIn+' '+currentDriver.display_name+' ('+currentDriver.login+')':t.signedOut;el('sessionStatus').textContent=t[sessionMessage]||'';el('title').textContent=t.title;el('hint').textContent=scanMode==='pass'&&scanning?(passMisses>=5?t.passUnread:t.passHint):t.hint;
 const passCamera=scanning&&scanMode==='pass';el('camera').classList.toggle('pass',scanMode==='pass');
 scanBtn.textContent=scanning&&scanMode==='qr'?t.stop:t.qr;passBtn.textContent=passCamera?t.stop:t.pass;
 el('installBtn').title=t.install;el('installBtn').setAttribute('aria-label',t.install);el('manualTitle').textContent=t.manual;el('manualBtn').textContent=t.manualButton;if(!el('installHint').hidden)el('installHint').textContent=installHelpText();
 if(!last){result.hidden=true;return}result.hidden=false;result.className='result '+(last.allowed?'good':['already_boarded','choose_trip'].includes(last.reason)?'wait':'bad');el('resultTitle').textContent=last.allowed?t.allowed:(t[last.reason]||t.invalid);el('resultCard').textContent=last.card?t.card+' '+last.card:'';
 el('resultDetail').textContent=(last.legs||[]).map(x=>(lang==='tr'?x.origin_tr:x.origin)+' → '+(lang==='tr'?x.destination_tr:x.destination)+' · '+x.date+' '+x.departure.slice(0,5)+'\n'+t.time+': '+formatWindow(x.window_start)+' – '+formatWindow(x.window_end)).join('\n\n');el('resultDetail').style.whiteSpace='pre-line';el('resultNote').textContent=last.allowed?t.check:'';let choices=el('tripChoices');choices.replaceChildren();if(last.reason==='choose_trip'){for(let leg of last.choices||[]){let btn=document.createElement('button');btn.className='secondary';btn.style.margin='5px';btn.textContent=t.chooseButton+' · '+(lang==='tr'?leg.origin_tr:leg.origin)+' → '+(lang==='tr'?leg.destination_tr:leg.destination)+' '+leg.departure.slice(0,5);btn.addEventListener('click',()=>verifyCode(last._token,leg.id,last._source||'qr'));choices.appendChild(btn)}}}
function clearResult(){if(resultTimer!==null){clearTimeout(resultTimer);resultTimer=null}last=null;render()}
function showVerification(x,started){last=x;render();result.scrollIntoView?.({block:'nearest',behavior:'smooth'});if(x.allowed){let left=Math.max(0,Math.min(15000,Number(x.remaining_ms)||0)-(performance.now()-started));resultTimer=setTimeout(()=>{if(last&&last.allowed){last={allowed:false,reason:'expiredResult'};render()}},left)}}
async function verifyCode(value,legId=null,source='qr'){
 if(!driverReady())return;scanning=false;clearTimeout(scanTimer);clearResult();
 const serial=++checkSerial,started=performance.now(),abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),10000);activeRequests.add(abort);el('hint').textContent=texts[lang].busy;setScanBusy(true);
 try{const x=await recordBoarding(value,legId,source,abort.signal,serial);if(serial!==checkSerial)return;if(x.reason==='choose_trip'){x._token=value;x._source=source}showVerification(x,started)}
 catch(e){if(serial===checkSerial){last={allowed:false,reason:'net'};render()}}
 finally{clearTimeout(timeout);activeRequests.delete(abort);if(serial===checkSerial){setScanBusy(false);el('hint').textContent=texts[lang].hint}}
}
async function verifyCard(){
 if(el('manualBtn').disabled||!driverReady())return;const card=el('manualInput').value.trim();if(!/^[0-9]{4,12}$/.test(card)){clearResult();last={allowed:false,reason:'badCard'};render();return}
 el('manualInput').blur?.();stopCamera();clearResult();const serial=++checkSerial,started=performance.now(),abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),10000);activeRequests.add(abort);el('manualBtn').disabled=true;setScanBusy(true);el('hint').textContent=texts[lang].busy;
 try{const r=await fetch('/bus/api/find-booking',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({card}),signal:abort.signal});if(!r.ok)throw Error('network');const matches=(await r.json()).items;if(!Array.isArray(matches))throw Error('network');const checks=[];
 for(const item of matches.slice(0,12)){if(serial!==checkSerial)return;let link;try{link=new URL(item.url,location.origin);if(link.origin!==location.origin||!/^\/bus\/check\/BUS-[0-9A-F]{10}\/[A-Za-z0-9_-]{22}$/.test(link.pathname)||link.search||link.hash)continue}catch(e){continue}
 const checked=await authRequest('verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:link.href,record:false}),signal:abort.signal});if(!checked.ok)throw Error('network');const x=await checked.json();x._token=link.href;x._source='manual';checks.push(x);if(x.allowed||x.reason==='choose_trip')break}
 if(serial!==checkSerial)return;let selected=checks.find(x=>x.allowed||x.reason==='choose_trip')||checks.find(x=>x.reason==='outside_window')||checks[0]||{allowed:false,reason:'expired'};
 if(selected.allowed)selected=await recordBoarding(selected._token,selected.legs[0].id,'manual',abort.signal,serial);
 if(serial!==checkSerial)return;if(!selected.card)selected.card=card;showVerification(selected,started);
 }catch(e){if(serial===checkSerial){last={allowed:false,reason:'net'};render()}}
 finally{clearTimeout(timeout);activeRequests.delete(abort);if(serial===checkSerial){el('manualBtn').disabled=false;setScanBusy(false);el('hint').textContent=texts[lang].hint}}
}
async function readFrame(){const serial=checkSerial;if(!scanning||!stream)return;try{if(video.readyState>=2){let value='';if(detector){try{let codes=await detector.detect(video);value=codes[0]?.rawValue||''}catch(e){detector=null}}if(serial!==checkSerial||!scanning||!stream)return;if(!value&&typeof jsQR==='function'){let scale=Math.min(1,720/video.videoWidth),width=Math.max(1,Math.round(video.videoWidth*scale)),height=Math.max(1,Math.round(video.videoHeight*scale));canvas.width=width;canvas.height=height;let ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,width,height);let pixels=ctx.getImageData(0,0,width,height),found=jsQR(pixels.data,width,height,{inversionAttempts:'attemptBoth'});value=found?.data||''}if(value){await verifyCode(value);return}}}catch(e){}if(scanning)scanTimer=setTimeout(readFrame,250)}
async function readPass(){
 if(!scanning||scanMode!=='pass'||passRequest)return;
 if(video.readyState<2||!video.videoWidth){
  scanTimer=setTimeout(readPass,250);return;
 }
 const serial=checkSerial,abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),6000);
 passRequest=abort;
 const isCurrent=()=>serial===checkSerial&&scanning&&scanMode==='pass'&&passRequest===abort;
 try{
  const view=video.getBoundingClientRect(),frame=el('scanFrame').getBoundingClientRect();
  const scale=Math.max(view.width/video.videoWidth,view.height/video.videoHeight);
  const width=frame.width/scale,height=frame.height/scale;
  const left=(video.videoWidth-width)/2,top=(video.videoHeight-height)/2;
  const outputScale=Math.min(1,640/width,240/height);
  canvas.width=Math.max(1,Math.round(width*outputScale));canvas.height=Math.max(1,Math.round(height*outputScale));
  canvas.getContext('2d').drawImage(video,left,top,width,height,0,0,canvas.width,canvas.height);
  const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!isCurrent()||!png)return;
  const reply=await authRequest('read-pass',{method:'POST',body:png,headers:{'Content-Type':'image/png'},signal:abort.signal});
  if(!isCurrent())return;
  if(reply.status===401){expireSession();return}
  if(!reply.ok)throw Error('ocr');
  const {card}=await reply.json();
  if(!isCurrent()||!/^[0-9]{6}$/.test(card||''))return;
  el('manualInput').value=card;
  await verifyCard();
 }catch(e){
  // Camera and network failures are retried while this scan is open.
 }finally{
  clearTimeout(timeout);
  if(isCurrent()){
   passRequest=null;
   if(++passMisses===5)render();
   scanTimer=setTimeout(readPass,1000);
  }
 }
}
async function startCamera(mode='qr'){
 if(!driverReady())return;scanMode=mode;passMisses=0;const serial=++checkSerial;setScanBusy(true);clearResult();
 try{if(!stream){const opened=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},...(mode==='pass'?{width:{ideal:1280},height:{ideal:720}}:{})}});if(serial!==checkSerial||document.hidden){opened.getTracks().forEach(track=>track.stop());return}stream=opened;video.srcObject=stream;el('camera').hidden=false;await video.play();if(serial!==checkSerial)return;if(document.hidden||!stream){stopCamera();return}try{detector='BarcodeDetector'in window?new BarcodeDetector({formats:['qr_code']}):null}catch(e){detector=null}}
 if(serial!==checkSerial)return;el('camera').hidden=false;scanning=true;render();if(mode==='qr')readFrame();else scanTimer=setTimeout(readPass,350);
 }catch(e){if(serial===checkSerial){last={allowed:false,reason:'camera'};stopCamera()}}finally{if(serial===checkSerial)setScanBusy(false)}
}
function stopCamera(){scanning=false;passRequest?.abort();passRequest=null;clearTimeout(scanTimer);if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}video.srcObject=null;el('camera').hidden=true;render()}
function selectScanner(mode){
 const close=scanning&&scanMode===mode;
 if(scanning)stopCamera();
 if(!close)startCamera(mode);
}
scanBtn.addEventListener('click',()=>selectScanner('qr'));
passBtn.addEventListener('click',()=>selectScanner('pass'));
el('langBtn').addEventListener('click',()=>{lang=lang==='ru'?'tr':'ru';try{localStorage.setItem('bus-scanner-lang',lang)}catch(e){}render()});
const cardInput=el('manualInput');cardInput.addEventListener('input',()=>{cardInput.value=cardInput.value.replace(/\D/g,'')});cardInput.addEventListener('focus',()=>cardInput.select());cardInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();verifyCard()}});el('manualBtn').addEventListener('click',verifyCard);
function installedAsApp(){return !!navigator.standalone||matchMedia('(display-mode: standalone)').matches}
function installHelpText(){let t=texts[lang],ua=navigator.userAgent||'';return /Android/i.test(ua)?t.installTipAndroid:/Windows|Macintosh|Linux/i.test(ua)?t.installTipDesktop:t.installTip}
function showInstallHelp(){el('installHint').textContent=installHelpText();el('installHint').hidden=false}
function updateInstallUI(){el('installPanel').hidden=installedAsApp()}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;updateInstallUI()});
window.addEventListener('appinstalled',()=>{installEvent=null;el('installPanel').hidden=true;el('installHint').hidden=true});
el('installBtn').addEventListener('click',async()=>{if(installedAsApp()){updateInstallUI();return}if(installEvent){let event=installEvent;installEvent=null;try{await event.prompt()}catch(e){showInstallHelp()}return}showInstallHelp()});
const displayMode=matchMedia('(display-mode: standalone)');displayMode.addEventListener?.('change',updateInstallUI);
updateInstallUI();
document.addEventListener('visibilitychange',()=>{if(document.hidden)invalidateChecks()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/bus/scanner/sw.js',{scope:'/bus/scanner/'}).catch(()=>{});
render();restoreSession();
</script>
