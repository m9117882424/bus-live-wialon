<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07549b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TSM Посадка">
  <link rel="manifest" href="/bus/scanner/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/bus/scanner/icon-192.png">
  <title>TSM BUS · Посадка</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#142d48;font:16px system-ui,-apple-system,sans-serif}
    header{height:56px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:3px solid #13a6a0;padding:7px 14px}
    header img{height:34px;width:auto;vertical-align:middle}header b{margin-left:8px;color:#07549b;font-size:15px}
    main{max-width:560px;margin:auto;padding:12px 12px 28px}h1{font-size:22px;margin:3px 0 10px}
    button{font:inherit;font-weight:700;border:0;border-radius:10px;min-height:48px;padding:9px 14px;cursor:pointer}
    .primary{width:100%;background:#07549b;color:white}.secondary{background:#e8f1f9;color:#07549b}
    .lang{min-height:40px;padding:6px 12px}.camera{position:relative;overflow:hidden;border-radius:13px;background:#102d46;margin:8px 0}
    video{display:block;width:100%;height:min(36vh,300px);min-height:170px;object-fit:cover}.frame{position:absolute;pointer-events:none;inset:17% 24%;border:3px solid #fff9;border-radius:14px;box-shadow:0 0 0 999px #0003}
    .hint{font-size:14px;color:#526e84;margin:8px 0}.result{border-radius:14px;padding:16px;margin:10px 0;font-weight:700;overflow-wrap:anywhere}
    .result.good{background:#d5f5df;color:#12642d;border:2px solid #3ba758}.result.bad{background:#ffe6e3;color:#a32727;border:2px solid #d56159}
    .result h2{font-size:clamp(23px,6vw,30px);line-height:1.15;margin:0 0 8px}.result .cardno{font-size:clamp(25px,7vw,34px);line-height:1.15}
    .result .detail{font-size:15px;font-weight:600;line-height:1.4;margin-top:8px}.result .note{font-size:13px;font-weight:500;margin-top:9px}
    .tools{display:flex;gap:8px;margin-top:8px}.tools button{flex:1;min-width:0}.tools button:disabled{opacity:.65}
    details{margin-top:12px;color:#526e84;font-size:14px}summary{cursor:pointer}textarea{width:100%;font:inherit;padding:9px;border:1px solid #bacbd7;border-radius:9px;margin:8px 0;min-height:68px}
    .install-hint{margin:7px 0;color:#526e84;font-size:13px} [hidden]{display:none!important}
  </style>
</head>
<body>
<header><span><img src="/bus/logo.png" alt="TSM ENERJİ"><b>BUS</b></span><button class="secondary lang" id="langBtn">RU / TR</button></header>
<main>
  <h1 id="title"></h1>
  <div class="camera" id="camera" hidden><video id="video" playsinline muted></video><div class="frame"></div></div>
  <div class="result" id="result" role="status" aria-live="polite" hidden><h2 id="resultTitle"></h2><div class="cardno" id="resultCard"></div><div class="detail" id="resultDetail"></div><div class="note" id="resultNote"></div></div>
  <p class="hint" id="hint"></p>
  <button class="primary" id="scanBtn"></button>
  <div class="tools"><button class="secondary" id="installBtn"></button></div>
  <p class="install-hint" id="installHint" hidden></p>
  <details><summary id="manualTitle"></summary><textarea id="manualInput" autocomplete="off" spellcheck="false"></textarea><button class="secondary" id="manualBtn"></button></details>
</main>
<canvas id="canvas" hidden></canvas>
<script src="/bus/scanner/jsQR.js"></script>
<script>
const texts={
 ru:{title:'Контроль посадки',start:'Включить камеру',stop:'Остановить камеру',next:'Сканировать следующий QR',hint:'Наведите камеру на QR-код подтверждения.',allowed:'✓ Посадка разрешена!',card:'Пропуск №',check:'Сверьте номер с пропуском пассажира.',invalid:'QR-код не подтверждён',cancelled:'Бронь отменена',expired:'Бронь не найдена или срок истёк',outside:'Посадка сейчас не разрешена',time:'Время допуска',net:'Нет связи с сервером. Проверка невозможна.',camera:'Нет доступа к камере. Разрешите доступ в настройках телефона.',busy:'Проверяем…',expiredResult:'Проверка завершена. Отсканируйте QR заново.',install:'Установить приложение',installTip:'В меню браузера выберите «Установить приложение» или «Добавить на главный экран».',manual:'Ввести QR вручную',manualButton:'Проверить'},
 tr:{title:'Biniş kontrolü',start:'Kamerayı aç',stop:'Kamerayı durdur',next:'Sonraki QR kodunu okut',hint:'Kamerayı onay belgesindeki QR koduna tutun.',allowed:'✓ Binişe izin verildi!',card:'Kart no:',check:'Numarayı yolcunun kartıyla karşılaştırın.',invalid:'QR kodu doğrulanamadı',cancelled:'Rezervasyon iptal edildi',expired:'Rezervasyon bulunamadı veya süresi doldu',outside:'Şu anda binişe izin verilmiyor',time:'Biniş aralığı',net:'Sunucu bağlantısı yok. Doğrulama yapılamıyor.',camera:'Kameraya erişilemiyor. Telefon ayarlarından izin verin.',busy:'Kontrol ediliyor…',expiredResult:'Kontrol tamamlandı. QR kodunu yeniden okutun.',install:'Uygulamayı yükle',installTip:'Tarayıcı menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini seçin.',manual:'QR kodunu elle gir',manualButton:'Kontrol et'}
};
let lang='ru',stream=null,detector=null,scanning=false,scanTimer=null,resultTimer=null,installEvent=null,last=null,checkSerial=0;
try{lang=localStorage.getItem('bus-scanner-lang')||'ru'}catch(e){}
if(!texts[lang])lang='ru';
const el=id=>document.getElementById(id);
const video=el('video'),canvas=el('canvas'),result=el('result'),scanBtn=el('scanBtn');
function formatWindow(value){try{return new Intl.DateTimeFormat(lang==='tr'?'tr-TR':'ru-RU',{timeZone:'Europe/Istanbul',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value))}catch(e){return value}}
function render(){let t=texts[lang];document.documentElement.lang=lang;el('title').textContent=t.title;el('hint').textContent=t.hint;scanBtn.textContent=scanning?t.stop:last?t.next:t.start;el('installBtn').textContent=t.install;el('manualTitle').textContent=t.manual;el('manualBtn').textContent=t.manualButton;if(!el('installHint').hidden)el('installHint').textContent=t.installTip;
 if(!last){result.hidden=true;return}result.hidden=false;result.className='result '+(last.allowed?'good':'bad');el('resultTitle').textContent=last.allowed?t.allowed:(t[last.reason]||t.invalid);el('resultCard').textContent=last.card?t.card+' '+last.card:'';
 el('resultDetail').textContent=(last.legs||[]).map(x=>(lang==='tr'?x.origin_tr:x.origin)+' → '+(lang==='tr'?x.destination_tr:x.destination)+' · '+x.date+' '+x.departure.slice(0,5)+'\n'+t.time+': '+formatWindow(x.window_start)+' – '+formatWindow(x.window_end)).join('\n\n');el('resultDetail').style.whiteSpace='pre-line';el('resultNote').textContent=last.allowed?t.check:''}
function clearResult(){if(resultTimer!==null){clearTimeout(resultTimer);resultTimer=null}last=null;render()}
async function verifyCode(value){scanning=false;clearTimeout(scanTimer);clearResult();let serial=++checkSerial,started=performance.now();el('hint').textContent=texts[lang].busy;scanBtn.disabled=true;
 try{let abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),10000),r;try{r=await fetch('/bus/api/scanner/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:value}),signal:abort.signal})}finally{clearTimeout(timeout)}if(!r.ok)throw Error('network');let x=await r.json();if(serial!==checkSerial)return;last=x;render();if(x.allowed){let left=Math.max(0,Math.min(15000,Number(x.remaining_ms)||0)-(performance.now()-started));resultTimer=setTimeout(()=>{if(last&&last.allowed){last={allowed:false,reason:'expiredResult'};render()}},left)}}catch(e){if(serial===checkSerial){last={allowed:false,reason:'net'};render()}}finally{if(serial===checkSerial){scanBtn.disabled=false;el('hint').textContent=texts[lang].hint}}}
async function readFrame(){if(!scanning||!stream)return;try{if(video.readyState>=2){let value='';if(detector){try{let codes=await detector.detect(video);value=codes[0]?.rawValue||''}catch(e){detector=null}}if(!scanning||!stream)return;if(!value&&typeof jsQR==='function'){let scale=Math.min(1,720/video.videoWidth),width=Math.max(1,Math.round(video.videoWidth*scale)),height=Math.max(1,Math.round(video.videoHeight*scale));canvas.width=width;canvas.height=height;let ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,width,height);let pixels=ctx.getImageData(0,0,width,height),found=jsQR(pixels.data,width,height,{inversionAttempts:'attemptBoth'});value=found?.data||''}if(value){await verifyCode(value);return}}}catch(e){}if(scanning)scanTimer=setTimeout(readFrame,250)}
async function startCamera(){scanBtn.disabled=true;try{checkSerial++;clearResult();if(!stream){let opened=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});if(document.hidden){opened.getTracks().forEach(track=>track.stop());return}stream=opened;video.srcObject=stream;el('camera').hidden=false;await video.play();if(document.hidden||!stream){stopCamera();return}try{detector='BarcodeDetector'in window?new BarcodeDetector({formats:['qr_code']}):null}catch(e){detector=null}}el('camera').hidden=false;scanning=true;render();readFrame()}catch(e){last={allowed:false,reason:'camera'};render();stopCamera()}finally{scanBtn.disabled=false}}
function stopCamera(){scanning=false;clearTimeout(scanTimer);if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}video.srcObject=null;el('camera').hidden=true;render()}
scanBtn.addEventListener('click',()=>{if(scanning)stopCamera();else startCamera()});
el('langBtn').addEventListener('click',()=>{lang=lang==='ru'?'tr':'ru';try{localStorage.setItem('bus-scanner-lang',lang)}catch(e){}render()});
el('manualBtn').addEventListener('click',()=>{let value=el('manualInput').value.trim();if(value)verifyCode(value)});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event});
el('installBtn').addEventListener('click',async()=>{if(installEvent){let event=installEvent;installEvent=null;await event.prompt()}else{el('installHint').hidden=false;el('installHint').textContent=texts[lang].installTip}});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)el('installBtn').hidden=true;
document.addEventListener('visibilitychange',()=>{if(document.hidden){checkSerial++;stopCamera();clearResult();scanBtn.disabled=false}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/bus/scanner/sw.js',{scope:'/bus/scanner/'}).catch(()=>{});
render();
</script>
</body>
</html>
